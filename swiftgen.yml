input_dir: FoodScanner
output_dir: FoodScanner

xcassets:
  inputs:
    - Assets.xcassets
  outputs:
    - templateName: swift5
      output: Generated/Assets.swift

strings:
  inputs:
    - fr.lproj/Localizable.strings
  outputs:
    - templateName: structured-swift5
      output: Generated/Strings.swift

yaml:
  inputs:
    - SFSymbols.yml
  outputs:
    - templateName: inline-swift5
      params:
        enumName: SFSymbol
      output: Generated/SFSymbols.swift
