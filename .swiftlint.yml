excluded:
  - FoodScanner/Open Source Code
  - FoodScanner/Generated
  - FoodScannerUI/Sources/FoodScannerUI/Generated
  - FoodScannerUI/.build
  - FoodScannerUI/Package.swift
  - .build
  - DerivedData
  - FoodScanner.xcodeproj

disabled_rules:
  - todo
  - trailing_whitespace
  - identifier_name
  - type_name
  - cyclomatic_complexity
  - function_body_length
  - nesting

opt_in_rules:
  - empty_count
  - fatal_error_message

line_length:
  warning: 160
  error: 250
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 400
  error: 700

large_tuple:
  warning: 4

force_cast: warning
force_try: warning
force_unwrapping: warning

custom_rules:
  no_explanatory_comments:
    included: ".*\\.swift"
    match_kinds:
      - comment
      - doccomment
    regex: '//+(?!\s*$)(?!\s*(TODO|FIXME|SECURITY)\s*:)(?!\s*[\w .+\-À-ÿ]+\.swift\s*$)(?!\s*FoodScanner(UI|Tests|UITests)?\s*$)(?!\s*Copyright © (MULLOT Romain EI|\d{4} [^.]+)\.\s*All rights reserved\.\s*$)(?!\s*Created (on|by) .*$)(?!\s*swiftlint:)'
    message: "No explanatory comments allowed, except `// TODO:`/`// FIXME:` and `// SECURITY:`-tagged lines (see CLAUDE.md). The mandatory copyright header is exempt."
    severity: warning

reporter: "xcode"
